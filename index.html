<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO アプリ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1 class="app__title">TODO</h1>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input
        id="todo-input"
        class="todo-form__input"
        type="text"
        placeholder="やることを入力して Enter"
        maxlength="200"
        aria-label="新しいタスク"
      />
      <button type="submit" class="todo-form__button">追加</button>
    </form>

    <div class="filters" role="tablist" aria-label="表示フィルター">
      <button class="filters__button is-active" data-filter="all" role="tab">すべて</button>
      <button class="filters__button" data-filter="active" role="tab">未完了</button>
      <button class="filters__button" data-filter="completed" role="tab">完了</button>
    </div>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <p id="empty-message" class="empty-message" hidden>タスクはありません</p>

    <footer class="app__footer">
      <span id="todo-count" class="app__count">0 件の未完了</span>
      <button id="clear-completed" class="app__clear" type="button">完了を削除</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
